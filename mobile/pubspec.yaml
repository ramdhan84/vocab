name: kids_vocab_game
description: Offline-first, kid-friendly vocabulary app built with Flutter
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^3.8.3
  speech_to_text: ^6.5.0
  image_picker: ^1.1.3
  path_provider: ^2.1.3
  permission_handler: ^11.3.0
  flutter_riverpod: ^2.5.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
