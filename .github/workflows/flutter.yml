name: Flutter CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["001-kids-vocab-game"]

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Flutter analyze
        run: |
          flutter --version
          flutter pub get
          flutter analyze
      - name: Flutter tests
        run: |
          flutter test --no-pub

  network-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 'stable'
      - name: Run network smoke scanner
        run: |
          dart scripts/network_smoke_test.dart
